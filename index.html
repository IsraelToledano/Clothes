<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Drape">
<title>Drape</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  --bg:#EEF0F3;--card:#FFFFFF;--ink:#16181D;--muted:#4A505C;--line:#C9CDD5;--soft:#E3E6EB;--hate:#DCE0E6;
  --accent:#2A44D8;--accent-press:#1C2F9E;--danger:#B42318;
  --display:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.screen{min-height:100vh;min-height:100dvh;max-width:520px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.screen.fixed{height:100vh;height:100dvh;min-height:0;overflow:hidden;gap:10px}
.screen.roomy{gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.wordmark{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:20px;height:20px}
.spacer{width:44px;flex:none}
.meta{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.h1{margin:0;font-family:var(--display);font-weight:800;font-size:36px;line-height:1.04;letter-spacing:-.03em}
.label{display:block;font-size:16px;font-weight:700;margin:0 0 10px;padding:0}
.label .hint{font-weight:400;color:var(--muted)}
.mono-label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.chip svg{width:14px;height:14px}
textarea{display:block;width:100%;min-height:92px;resize:none;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:16px;line-height:1.4}
textarea::placeholder{color:#686E79}
.cta{height:58px;border-radius:29px;border:0;background:var(--accent);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.cta:active{background:var(--accent-press)}
a.cta{text-decoration:none}
.cta svg{width:20px;height:20px}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:4px}
.sticky{position:sticky;bottom:calc(10px + var(--safe-b))}
.link-btn{min-height:44px;border:0;background:transparent;color:var(--ink);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.link-btn.danger{color:var(--danger)}
.outline-btn{min-height:50px;border-radius:25px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px;text-decoration:none}
.outline-btn.filled{background:var(--card)}
.outline-btn svg{width:18px;height:18px;flex:none}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.steps li::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.steps li.on{color:var(--ink);font-weight:700}
.steps li.on::before,.steps li.done::before{background:var(--ink)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4;flex:none}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner p{margin:0}
.recent{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.recent li{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 8px 6px 6px;min-width:0}
.recent .sw{flex:none;width:34px;height:34px;border-radius:10px}
.recent .tx{display:flex;flex-direction:column;min-width:0}
.recent .t{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .v{font-family:var(--mono);font-size:11px;color:var(--muted)}
.recent .v.love{color:var(--accent)}
.idea{flex:1 1 auto;min-height:0;background:var(--card);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.idea-img{position:relative;flex:1 1 auto;min-height:200px;display:flex;align-items:center;justify-content:center}
.idea-img img.prod{object-fit:cover;object-position:center;background:#fff}
.idea-img img.prod ~ .tag,.idea-img .tag{box-shadow:0 0 0 1px rgba(22,24,29,.08)}
.price{font-weight:700;color:var(--ink)}
.idea-img img{-webkit-user-drag:none;-webkit-touch-callout:none;pointer-events:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 44px;text-align:center;color:#3B404A}
.ph svg{width:40px;height:40px}
.tag{position:absolute;z-index:1;top:12px;left:12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:#fff;color:var(--ink);padding:6px 10px;border-radius:999px}
.diag{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:12px;font-family:var(--mono)}
.diag li{display:flex;gap:8px;align-items:baseline}
.diag b{flex:none;width:48px}
.diag .ok{color:#1E8E4E}
.diag .bad{color:var(--danger);overflow-wrap:anywhere}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.stamp{position:absolute;z-index:2;top:50%;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;font-size:20px;font-weight:800;letter-spacing:.02em;background:#fff;pointer-events:none;opacity:0;transform:translateY(-50%) rotate(var(--rot));box-shadow:0 6px 24px rgba(0,0,0,.18)}
.stamp svg{width:22px;height:22px}
.stamp.no{right:16px;--rot:8deg;color:var(--ink);opacity:var(--no,0)}
.stamp.yes{left:16px;--rot:-8deg;color:var(--accent);opacity:var(--yes,0)}
.swipe-hint{position:absolute;z-index:1;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(22,24,29,.78);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;pointer-events:none}
.idea-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:none}
.specline{margin:0;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insight{position:absolute;z-index:1;bottom:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;background:rgba(22,24,29,.82);color:#fff;border-radius:12px;padding:7px 10px;font-size:12px;line-height:1.3;pointer-events:none}
.insight svg{width:14px;height:14px;flex:none}
.insight span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:grid;grid-template-columns:auto 1fr;gap:8px;flex:none}
.acts .outline-btn{min-height:46px;font-size:14px}
.save-btn{width:auto;padding:0 18px}
.save-btn.on{background:var(--ink);color:#fff}
.hist.saved li{padding:6px 0}
.sv-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.sv-open .t{display:flex;flex-direction:column;font-weight:600}
.sv-open small{font-size:12px;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.icon-btn.sm{width:36px;height:36px;border-radius:18px}
.idea-head{display:flex;flex-direction:column;gap:6px}
.because{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea-title{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.08;letter-spacing:-.02em}
.idea-desc{margin:0;font-size:14px;line-height:1.35;color:var(--muted)}
.idea .idea-desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.specs{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.specs div{display:flex;flex-direction:column;gap:3px;min-width:0}
.specs dt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.specs dd{margin:0;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.votes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none}
.vote{height:58px;border-radius:29px;border:0;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink);padding:0 2px}
.vote svg{width:20px;height:20px}
.vote.later{background:var(--hate)}
.vote.hate{background:var(--hate)}
.vote.like{background:var(--accent);color:#fff}
.vote.love{background:var(--accent);color:#fff}
.vote:active{transform:scale(.97)}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:0 8px}
.empty .idea-desc{margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(160px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.18)}
.toast.plain{padding:10px 16px}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{height:36px;border-radius:18px;border:0;background:#fff;color:var(--ink);padding:0 14px;font-weight:700;flex:none}
.scrim{position:fixed;inset:0;background:rgba(22,24,29,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-b));display:flex;flex-direction:column;gap:18px;max-height:92dvh;overflow:auto}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.picked{display:flex;align-items:center;gap:14px}
.picked h2{margin:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1}
.picked .sub{font-size:13px;color:var(--muted)}
.thumb{flex:none;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;color:#3B404A}
.thumb svg{width:24px;height:24px}
.thumb.sm{width:52px;height:52px;border-radius:14px}
.sizes{display:grid;gap:8px}
.sizes .chip{padding:0;border-radius:12px}
.check{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 14px;border-radius:14px;background:var(--bg);font-size:15px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.ctx{display:flex;align-items:center;gap:12px}
.ctx h1{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.undo-pill{min-height:44px;min-width:0;max-width:100%;border:0;border-radius:22px;background:var(--ink);color:#fff;padding:0 6px 0 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.undo-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.undo-pill b{flex:none;background:#fff;color:var(--ink);border-radius:16px;height:32px;padding:0 12px;display:grid;place-items:center}
.pill{font-size:14px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.card{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:16px;font-weight:700}
.card p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.store{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.store b{display:block;font-size:16px}
.store small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.store svg{width:18px;height:18px;flex:none}
.store-group{display:flex;flex-direction:column;gap:8px}
.store-group h3{margin:4px 0 0;font-weight:400}
.stores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.store.sm{min-height:58px;padding:8px 10px 8px 14px;gap:6px;border-radius:14px}
.store.sm span{min-width:0}
.store.sm b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store.sm small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store.sm svg{width:15px;height:15px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-size:14px;padding:6px 12px;border-radius:999px}
.tchip.plus{border:1.5px solid var(--ink);font-weight:500}
.tchip.minus{background:var(--soft);color:#3B404A}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--soft);min-width:0}
.hist li:first-child{border-top:0}
.hist .sw{flex:none;width:32px;height:32px;border-radius:10px}
.hist .t{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .v{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.hist .v.love,.hist .v.like{color:var(--accent)}
.modal{background:var(--card);border-radius:24px;padding:22px;margin:16px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.modal p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
.btn{min-height:44px;border-radius:22px;padding:0 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.small-note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.hbtns{display:flex;gap:8px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.ver{height:30px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-family:var(--mono);font-size:12px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;flex:none}
.ver svg{width:13px;height:13px}
.ask-btn{color:var(--accent);border-color:var(--accent)}
.ask-btn.ready{width:auto;padding:0 16px;font-size:14px;font-weight:700;background:var(--accent);color:#fff}
.ask-msg{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));z-index:70;background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:14px;max-width:calc(100% - 32px);text-align:center;display:none;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.ask-msg.show{display:block}
.small-note .link-btn{min-height:0;padding:0;font-size:13px;color:var(--muted)}
/* AI photos, loading states, products */
.idea-img img{opacity:0;transition:opacity .3s ease}
.idea-img img.ok{opacity:1}
.ph.wait .mono-label{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.shimmer{background:linear-gradient(100deg,var(--soft) 30%,#F5F6F8 50%,var(--soft) 70%) !important;background-size:300% 100% !important;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}
.sk{display:block;height:14px;border-radius:7px;background:var(--soft)}
.vote:disabled{opacity:.4;cursor:default}
.outline-btn:disabled{opacity:.4;cursor:default}
.sw,.thumb{position:relative;overflow:hidden}
.sw img,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.field{display:block;width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px}
.ai-status{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.dot{width:10px;height:10px;border-radius:5px;background:var(--line);flex:none}
.dot.on{background:#1E8E4E}
details summary{cursor:pointer;font-size:14px;color:var(--muted);min-height:32px;display:flex;align-items:center}
/* photos on the card: bars like Tinder, tap the sides for the next or previous one */
.bars{position:absolute;z-index:2;top:8px;left:10px;right:10px;display:flex;gap:4px;pointer-events:none}
.bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.6);box-shadow:0 0 0 .5px rgba(22,24,29,.3)}
.bars i.on{background:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.75)}
.bars ~ .tag{top:22px}
.photo-hint{bottom:56px;white-space:normal;width:max-content;max-width:calc(100% - 24px);text-align:center}
/* the photo takes the whole card; name and price sit on it, like Tinder */
.screen.fixed{padding-left:10px;padding-right:10px}
.idea.over .idea-img{flex:1 1 auto}
.idea-low{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.idea-low .swipe-hint{position:static;transform:none}
.idea-low .insight{position:static;align-self:stretch;margin:0 12px}
.idea.over .idea-body{align-self:stretch;pointer-events:auto;background:linear-gradient(to top,rgba(10,11,14,.86) 0%,rgba(10,11,14,.66) 62%,rgba(10,11,14,0) 100%);padding:30px 14px 14px 16px;color:#fff}
.idea.over .idea-title{color:#fff;font-size:21px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.idea.over .idea-desc{color:rgba(255,255,255,.9)}
.idea.over .price{color:#fff}
.idea.over .was{color:rgba(255,255,255,.66)}
.idea.over .because{color:#C3CEFF}
.idea.over .info-btn{background:#fff;border-color:#fff}
.card-zoom{position:absolute;z-index:3;top:20px;right:12px;width:44px;height:44px;border-radius:22px;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 0 0 1px rgba(22,24,29,.08),0 2px 10px rgba(0,0,0,.12)}
.card-zoom svg{width:22px;height:22px}
.idea-body.row{flex-direction:row;align-items:center;gap:10px;cursor:pointer}
.idea-body.row .idea-head{flex:1;min-width:0}
.idea .idea-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info-btn{flex:none;width:46px;height:46px;border-radius:23px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.info-btn svg{width:22px;height:22px}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- state ---------------- */
let Q = load("query", {type:"", styles:[], text:""});
let TASTE = load("taste", {w:{}, votes:[]});
let PREFS = load("prefs", {budget:"any", size:"M", shoe:"43", shipIL:true});
let PICKS = load("picks", []);
let SAVED = load("saved", []); // pieces you kept: full idea + when
let LIKED = load("liked", null); // real pieces you swiped right on (newest first), so they can be shown again
const S = {screen:"start", prev:"start", round:{votes:[]}, current:null, picked:null, sheet:false, modal:null, toast:null, busy:false,
  // AI: ideas waiting to be shown, the request in flight, what the AI has learned this round
  queue:[], fetching:null, gen:0, aiErr:null, aiInsight:"", anchor:null, sampleRound:false, checking:false,
  detail:null, more:{}, ph:0, phFor:null, stack:[]};
const aiRound = () => aiOn() && !S.sampleRound;

/* ---------------- taste model ----------------
   Every idea is a bundle of attributes (type, fit, fabric, colour, vibe,
   styles). A vote adds -2 / +1 / +2 to each of its attributes; the next idea
   is the unseen one whose attributes score highest, plus what you asked for
   on the start screen. With AI on, it re-orders the AI's waiting ideas. */
const attrsOf = (i) => [["type",i.type],["fit",i.fit],["fabric",i.fabric],["colour",i.colour],["vibe",i.vibe],["brand",i.brand],["kind",i.kind]].filter((a) => a[1]).concat((i.styles || []).map((s) => ["style",s]));
const akey = (a) => a[0] + ":" + a[1];

function keepLiked(idea, on){
  if (!LIKED) LIKED = [];
  LIKED = LIKED.filter((x) => x.id !== idea.id);
  if (on) LIKED.unshift(Object.assign({}, idea, {likedAt:Date.now()}));
  if (LIKED.length > 200) LIKED = LIKED.slice(0, 200);
  save("liked", LIKED);
}
function recordVote(idea, v, f, src){
  if (isProduct(idea) && (v === "like" || v === "love")) keepLiked(idea, true);
  if (VAL[v]) for (const a of attrsOf(idea)){ const k = akey(a); TASTE.w[k] = (TASTE.w[k] || 0) + VAL[v] * f; }
  const rec = {id:idea.id, title:idea.title, tint:idea.tint, v, f, src, at:Date.now()};
  TASTE.votes.push(rec);
  if (TASTE.votes.length > 600) TASTE.votes = TASTE.votes.slice(-600);
  save("taste", TASTE);
  return rec;
}
const isSaved = (id) => SAVED.some((x) => x.id === id);
function applySave(idea, sign){
  for (const a of attrsOf(idea)){ const k = akey(a); TASTE.w[k] = (TASTE.w[k] || 0) + sign * SAVE_VAL; if (Math.abs(TASTE.w[k]) < 1e-9) delete TASTE.w[k]; }
  save("taste", TASTE);
}
function toggleSave(i){
  if (!i) return;
  if (isSaved(i.id)){
    SAVED = SAVED.filter((x) => x.id !== i.id); applySave(i, -1);
    save("saved", SAVED); toast("Removed from saved"); return;
  }
  SAVED.push(Object.assign({}, i, {savedAt:Date.now()}));
  if (SAVED.length > 200) SAVED = SAVED.slice(-200);
  applySave(i, 1);
  save("saved", SAVED); toast("Saved · under the bookmark at the top");
}
function undoVote(rec){
  const i = TASTE.votes.lastIndexOf(rec);
  if (i < 0) return false;
  const idea = byId(rec.id);
  if (idea && VAL[rec.v]) for (const a of attrsOf(idea)){
    const k = akey(a); TASTE.w[k] = (TASTE.w[k] || 0) - VAL[rec.v] * rec.f;
    if (Math.abs(TASTE.w[k]) < 1e-9) delete TASTE.w[k];
  }
  TASTE.votes.splice(i, 1);
  save("taste", TASTE);
  if (idea && (rec.v === "like" || rec.v === "love") && !TASTE.votes.some((x) => x.id === rec.id && (x.v === "like" || x.v === "love"))) keepLiked(idea, false);
  return true;
}

const STOP = new Set("the and for with that this something some over under into onto from about like want need looking look just very really also have has had are was were will would could should can lot lots bit maybe kind sort thing things wear wearing throw style styles vibe vibes take version brand brands".split(" "));
const NEG = new Set(["not","no","nothing","without","avoid","never","hate","dont","don't","isnt","isn't","less"]);
function textSignals(text){
  const toks = String(text || "").toLowerCase().replace(/[^a-z'\s-]/g, " ").split(/\s+/).filter(Boolean);
  const pos = [], neg = []; let window = 0;
  for (const t of toks){
    if (NEG.has(t)){ window = 3; continue; }
    if (t.length < 3 || STOP.has(t) || t === "too"){ if (window) window--; continue; }
    (window > 0 ? neg : pos).push(t.replace(/s$/, ""));
    if (window) window--;
  }
  return {pos, neg};
}
function hay(i){ return [i.title, i.desc, i.type, i.fit, i.fabric, i.colour, i.vibe, i.brand, i.kind].concat(i.styles || []).filter(Boolean).join(" ").toLowerCase(); }
// What you asked for on the start screen (type, styles) is never held against an idea.
const asked = (kind, v) => (kind === "style" && Q.styles.includes(v)) || (kind === "type" && v === Q.type);
// Long-term taste, fairly: something counts for you when you liked pieces with it more often than you like
// pieces in general, and against you when you seldom did. Before 1.3 every "not now" pushed against everything
// in the piece, so the most common things (cotton, relaxed fit, the smart-casual you asked for) piled up
// against you just because most pieces have them. Saved pieces count as liked; each piece counts once.
let TM = null, TM_KEY = "";
function tasteModel(){
  const last = TASTE.votes[TASTE.votes.length - 1];
  const key = TASTE.votes.length + ":" + (last ? last.at + last.v : "") + ":" + SAVED.length + ":" + (SAVED.length ? SAVED[SAVED.length - 1].id : "");
  if (TM && TM_KEY === key) return TM;
  const n = {}, l = {}, done = new Set();
  let N = 0, L = 0;
  const add = (i, liked) => { N++; L += liked; for (const a of attrsOf(i)){ const k = akey(a); n[k] = (n[k] || 0) + 1; l[k] = (l[k] || 0) + liked; } };
  for (let j = TASTE.votes.length - 1; j >= 0; j--){
    const v = TASTE.votes[j];
    if (done.has(v.id)) continue; // the newest answer about a piece is the one that counts
    done.add(v.id);
    const i = byId(v.id);
    if (i) add(i, v.v === "like" || v.v === "love" || isSaved(v.id) ? 1 : 0);
  }
  for (const x of SAVED) if (!done.has(x.id)){ done.add(x.id); add(x, 1); }
  const p = N ? L / N : 0.25, A = 4, pref = {};
  for (const k in n) pref[k] = {v:(l[k] + A * p) / (n[k] + A) - p, n:n[k], l:l[k]};
  TM = {p, pref, N, L}; TM_KEY = key;

}
function score(i, sig, steady){
  let s = 0;
  const tm = tasteModel();
  for (const a of attrsOf(i)){
    if (a[0] === "type") continue; // you chose the type
    const t = tm.pref[akey(a)];
    if (!t) continue;
    let w = t.v * 6;
    if (w < 0 && asked(a[0], a[1])) w = 0;
    s += w;
  }
  for (const st of Q.styles) if (i.styles.includes(st)) s += 3;
  const h = hay(i);
  for (const w of sig.pos) if (h.includes(w)) s += 2;
  for (const w of sig.neg) if (h.includes(w)) s -= 4;
  return s + (steady ? 0 : Math.random() * 0.8);
}
function nextIdea(){ return S.sampleRound ? nextSample() : takeNext(); }
function nextSample(){
  const seen = new Set(S.round.votes.map((v) => v.id));
  let pool = SAMPLE_IDEAS.filter((i) => !seen.has(i.id));
  if (Q.type && Q.type !== "Surprise me") pool = pool.filter((i) => i.type === Q.type);
  const hated = new Set(TASTE.votes.filter((v) => v.v === "hate").map((v) => v.id));
  const fresh = pool.filter((i) => !hated.has(i.id));
  if (fresh.length) pool = fresh;
  if (!pool.length) return null;
  const sig = textSignals(Q.text);
  const scored = pool.map((i) => [i, score(i, sig)]).sort((a, b) => b[1] - a[1]);
  return scored[0][0];
}

function phrase(k){
  const ix = k.indexOf(":"), kind = k.slice(0, ix), v = k.slice(ix + 1).toLowerCase();
  if (kind === "fit") return v + " fits";
  if (kind === "style") return v + " looks";
  if (kind === "vibe") return v + " pieces";
  return v;
}
function chipLabel(k){
  const ix = k.indexOf(":"), kind = k.slice(0, ix), v = k.slice(ix + 1);
  if (kind === "fit") return v + " fit";
  if (kind === "vibe") return v + " vibe";
  return v;
}
const joinAnd = (a) => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
function roundInsight(){
  const votes = S.round.votes;
  if (votes.length < 3) return "";
  const w = {};
  for (const v of votes){
    const i = byId(v.id); if (!i) continue;
    for (const a of attrsOf(i)){ if (a[0] === "type") continue; const k = akey(a); w[k] = (w[k] || 0) + VAL[v.v]; }
  }
  const ent = Object.entries(w);
  const pos = ent.filter((e) => e[1] >= 2).sort((a, b) => b[1] - a[1]).slice(0, 2).map((e) => phrase(e[0]));
  const neg = ent.filter((e) => e[1] <= -2).sort((a, b) => a[1] - b[1]).slice(0, 2).map((e) => phrase(e[0]));
  const parts = [];
  if (pos.length) parts.push("more " + joinAnd(pos));
  if (neg.length) parts.push("less " + joinAnd(neg));
  return parts.join("; ");
}
function because(i){
  const mine = attrsOf(i).filter((a) => a[0] !== "type").map(akey);
  for (const v of S.round.votes.slice().reverse()){
    if (v.v === "hate" || v.v === "later") continue;
    const o = byId(v.id); if (!o || o.id === i.id) continue;
    const theirs = new Set(attrsOf(o).map(akey));
    if (mine.filter((k) => theirs.has(k)).length >= 2) return (v.v === "love" ? "Because you picked: " : "Because it was getting closer: ") + o.title;
  }
  return "";
}
// "More of": what your hearts and saves add up to. "Less of": only what you passed on at least four times
// and never hearted or saved. Weights alone over-count things almost every idea has (cotton, relaxed fit),
// and what you asked for on the start screen is never "less of".
function tasteLists(){
  const yes = {}, no = {};
  const count = (i, bag) => { for (const a of attrsOf(i)) bag[akey(a)] = (bag[akey(a)] || 0) + 1; };
  for (const v of TASTE.votes){ const i = byId(v.id); if (!i) continue; if (v.v === "like" || v.v === "love") count(i, yes); else if (v.v === "later" || v.v === "hate") count(i, no); }
  for (const x of SAVED) count(x, yes);
  const usable = (k) => { const ix = k.indexOf(":"); return !k.startsWith("type:") && !asked(k.slice(0, ix), k.slice(ix + 1)); };
  const pref = tasteModel().pref;
  return {
    pos: Object.entries(pref).filter(([k, t]) => t.l >= 2 && t.v >= 0.1 && !k.startsWith("type:")).sort((a, b) => b[1].v - a[1].v).slice(0, 6).map((e) => e[0]),
    neg: Object.entries(no).filter(([k, n]) => n >= 4 && !yes[k] && usable(k)).sort((a, b) => b[1] - a[1]).slice(0, 6).map((e) => e[0]),
  };
}

/* ---------------- AI (through the Cloudflare Worker) ----------------
   The AI writes ideas in small batches. Each request carries today's votes and
   your long-term taste, so every new batch reflects how you've voted so far.
   Between batches the local taste model re-orders what's waiting, so a vote
   changes what comes next straight away. */
const workerBase = () => String(AI.url || DEFAULT_WORKER).trim().replace(/\/+$/, "");
// Never wait forever: the server gives each model a time limit and falls back, and the app gives up
// after AI_TIMEOUT so a stuck request shows an error with "Try again" instead of an endless spinner.
const AI_TIMEOUT = 75000;
async function aiCall(path, body){
  let r;
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), AI_TIMEOUT);
  try{ r = await fetch(workerBase() + path, {method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(Object.assign({}, body, {code:AI.code})), signal:ctl.signal}); }
  catch(e){ clearTimeout(t); throw new Error(ctl.signal.aborted ? "The AI didn't answer within " + Math.round(AI_TIMEOUT / 1000) + " seconds." : "No connection to the AI server"); }
  let j = null; try{ j = await r.json(); }catch(e){}
  clearTimeout(t);
  if (!r.ok) throw new Error((j && j.error) || ("AI server error " + r.status));
  return j;
}
const uniq = (a) => Array.from(new Set(a));
function tastePayload(){
  const {pos, neg} = tasteLists();
  const list = (v) => uniq(TASTE.votes.filter((x) => x.v === v).map((x) => x.title)).slice(-10);
  return {more:pos.map(chipLabel), less:neg.map(chipLabel), loved:uniq(list("like").concat(list("love"))).slice(-10), hated:list("hate").concat(list("later")).slice(-10), saved:uniq(SAVED.map((p) => p.title)).slice(-10), picked:uniq(PICKS.map((p) => p.title)).slice(-8)};
}
function ideaFields(i){ return {title:i.title, desc:i.desc, type:i.type, colour:i.colour, fabric:i.fabric, fit:i.fit, vibe:i.vibe, search:i.search || ""}; }
function roundPayload(){ return S.round.votes.map((v) => { const i = byId(v.id) || {title:v.title}; return Object.assign(ideaFields(i), {vote:v.v}); }); }
function seenTitles(){
  const t = TASTE.votes.slice(-60).map((v) => v.title).concat(S.queue.map((i) => i.title));
  if (S.current) t.push(S.current.title);
  if (S.nextUp) t.push(S.nextUp.title);
  return uniq(t);
}

function bodyFor(opts){
  return {
    count:opts.count || BATCH,
    month:new Date().toLocaleString("en", {month:"long"}),
    query:{type:Q.type || "Surprise me", styles:Q.styles, text:Q.text},
    votes:roundPayload(), taste:tastePayload(), seen:seenTitles(),
    anchor:opts.hunt ? ideaFields(opts.hunt) : S.anchor ? ideaFields(S.anchor) : null,
    redirect:!!opts.redirect, converge:!!opts.hunt, angle:opts.angle || 0, round:S.roundId || "",
    kindStart:Number.isInteger(opts.kindStart) ? opts.kindStart : undefined,
  };
}

// "Same shirt, another colour" counts as a repeat: compare titles with colour words taken out.
const COLOUR_WORDS = /\b(light|dark|pale|deep|soft|faded|bright|navy|blue|white|ecru|cream|ivory|off|black|grey|gray|charcoal|green|olive|sage|khaki|tan|sand|stone|beige|brown|camel|rust|terracotta|red|burgundy|pink|coral|orange|yellow|mustard|purple|lavender|lilac|teal|mint|indigo|university|sky|powder|forest|bottle|chocolate|mocha|oatmeal|natural)\b/g;
function dupKey(i){
  const own = String(i.colour || "").toLowerCase().split(/[^a-z]+/).filter((w) => w.length > 2);
  let t = String(i.title || "").toLowerCase().replace(COLOUR_WORDS, " ");
  for (const w of own) t = t.split(w).join(" ");
  return t.replace(/[^a-z]+/g, " ").trim() + "|" + String(i.fabric || "").toLowerCase().trim();
}
// The same piece in another colour: same store, same title once colours (and a " - Colour" ending) are taken out.
// "Kith Striped Poplin Georgie Shirt - Hydrangea" and "... - Excellence" are one piece; so are Drake's
// "Green Narrow Stripe ... Shirt" and "Red Narrow Stripe ... Shirt".
function pieceKey(p){
  if (p._key) return p._key;
  let t = String(p.title || "").toLowerCase().replace(/\s[-–:|]\s[^-–:|]+$/, "").replace(COLOUR_WORDS, " ");
  for (const w of String(p.colour || "").toLowerCase().split(/[^a-z]+/).filter((x) => x.length > 2)) t = t.split(w).join(" ");
  return (p._key = (p.store || "") + "|" + t.replace(/[^a-z0-9]+/g, " ").trim());
}
const seenKey = (v) => { const i = byId(v.id); return i ? pieceKey(i) : "|" + String(v.title).toLowerCase(); };
function shownIdeas(){
  const l = S.round.votes.map((v) => byId(v.id)).filter(Boolean).concat(S.queue);
  if (S.current) l.push(S.current);
  if (S.nextUp) l.push(S.nextUp);
  return l;
}

// The order cards come in. The next two are fixed ("on deck") so their photos can be drawn ahead;
// everything behind them is re-ranked by your swipes after every swipe.
const ON_DECK = 1, PRELOAD_N = 4; // store photos load in well under a second, so one card on deck is enough
const PLAIN = new Set("shirt shirts tee the a an with and in of classic cotton blend fit long short sleeve sleeved men mens button down collar".split(" "));
const words = (i) => new Set(String((i.title || "") + " " + (i.fabric || "")).toLowerCase().replace(/[^a-z\s-]/g, " ").split(/[\s-]+/).filter((w) => w.length > 2 && !PLAIN.has(w)));
function orderQueue(){
  const sig = textSignals(Q.text);
  const deck = S.queue.slice(0, ON_DECK), rest = S.queue.slice(ON_DECK);
  // What's just been seen or is about to be: a madras right after two madras ones waits its turn.
  const recent = S.round.votes.slice(-3).map((v) => byId(v.id)).concat([S.current], deck).filter(Boolean).map(words);
  const near = (i) => { const w = words(i); return recent.reduce((n, r) => n + ([...w].some((x) => r.has(x)) ? 1 : 0), 0); };
  // ...and a third chambray in one search waits behind things you haven't seen yet.
  const seenWords = {};
  for (const v of S.round.votes){ const o = byId(v.id); if (o && v.v !== "like") for (const w of words(o)) seenWords[w] = (seenWords[w] || 0) + 1; }
  const repeats = (i) => Math.max(0, ...[...words(i)].map((w) => seenWords[w] || 0));
  // ...and not three pieces from the same store in a row, even among "more like" ones.
  const lastStores = S.round.votes.slice(-2).map((v) => (byId(v.id) || {}).store).concat([S.current && S.current.store], deck.map((d) => d.store)).filter(Boolean);
  const sameStore = (i) => i.store ? lastStores.filter((x) => x === i.store).length : 0;
  for (const i of rest) i._r = score(i, sig, true) + (i._boost || 0) - (i._pos || 0) * 0.15 - (i._boost === 10 ? near(i) * 1 : near(i) * 2.5 + repeats(i) * 1.5) - sameStore(i) * 3;
  rest.sort((a, b) => b._r - a._r);
  S.queue = deck.concat(rest);
}
function preloadAhead(){ S.queue.slice(0, PRELOAD_N).forEach(preload); }

// Real products: everything you swipe is a real piece in a real store, with its own photo, price and link.
// They come from a catalog of the stores' current menswear, rebuilt every day by GitHub Actions and served
// with the app (catalog/). Searching it happens here on the phone: instant, and the stores never see a
// burst of requests. The AI (when it's on) only turns your brief and your hearts into words to look for.
const isProduct = (i) => !!(i && String(i.id).startsWith("p-"));
// The stores' image service (Shopify's) sends each photo in the size asked for: small for lists, big for zooming.
function sized(u, w){
  u = String(u || "");
  if (!u) return "";
  if (u.startsWith("//")) u = "https:" + u;
  if (!/cdn\.shopify\.com|\/cdn\/shop\//.test(u)) return u;
  u = u.replace(/([?&])width=\d+&?/, "$1").replace(/[?&]$/, "");
  return u + (u.includes("?") ? "&" : "?") + "width=" + w;
}
// Every photo of a piece: up to 8 for a real product, the one AI photo for an idea.
function photosOf(i){
  if (!i) return [];
  if (isProduct(i)) return (i.images && i.images.length ? i.images : [i.image]).filter(Boolean);
  const u = i.image || imgUrl(i);
  return u ? [u] : [];
}
const photoAt = (i, k, w) => { const l = photosOf(i), u = l[Math.max(0, Math.min(l.length - 1, k))] || ""; return isProduct(i) ? sized(u, w) : u; };
const curPh = () => (S.current && S.phFor === S.current.id ? S.ph || 0 : 0);
function prepProduct(p){
  return Object.assign({desc:"", fit:"", vibe:"", styles:[], palette:[], search:p.title}, p, {type:p.type || (Q.type && Q.type !== "Surprise me" ? Q.type : ""), tint:"#FFFFFF"});
}
const money = (n, cur) => { try{ return new Intl.NumberFormat("en", {style:"currency", currency:cur || "USD", minimumFractionDigits:n % 1 ? 2 : 0, maximumFractionDigits:n % 1 ? 2 : 0}).format(n); }catch(e){ return (cur || "") + " " + n; } };
// Rough shekel prices for the budget filter.
const TO_ILS = {USD:3.7, GBP:4.8, EUR:4.0};
const ils = (p) => p.price * (TO_ILS[p.currency] || 3.7);

// Kinds of each type, from words in the title: they keep a search varied and tell the AI what you hearted.

function serverOutdated(v){
  const n = (x) => String(x).split(".").map((p) => parseInt(p, 10) || 0);
  if (!/^\d/.test(String(v))) return true;
  const a = n(v), b = n(SERVER_EXPECTED);
  for (let i = 0; i < 3; i++){ if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) < (b[i] || 0); }
  return false;
}

/* ---------------- render ---------------- */
function render(){
  const app = document.getElementById("app");
  // Re-drawing keeps the details view where you had scrolled it.
  const dt = document.getElementById("detail"), keepTop = dt && S.detail && dt.dataset.id === S.detail.item.id ? dt.scrollTop : 0;
  let html = S.screen === "explore" ? renderExplore() : S.screen === "shop" ? renderShop() : S.screen === "profile" ? renderProfile() : S.screen === "saved" ? renderSaved() : renderStart();
  if (S.sheet && S.current) html += renderSheet();
  if (S.detail) html += renderDetail();
  if (S.modal) html += renderModal();
  if (S.toast && !S.toast.undo) html += renderToast();
  app.innerHTML = html;
  document.body.classList.toggle("lock", !!(S.sheet || S.modal || S.detail || Z.open));
  if (S.detail){ const d2 = document.getElementById("detail"); if (d2) d2.scrollTop = keepTop; bindDetail(); }
  if (S.screen === "explore"){ bindSwipe(); if (S.current) preloadUrl(photoAt(S.current, curPh() + 1, 900)); }
  const f = S.focus && document.querySelector(S.focus);
  if (f) f.focus();
  S.focus = null;
  saveSession();
}
// Saved and the taste profile open on top of where you were; Back returns there. Opening one that's
// already open underneath goes back to it instead of piling up.
function openScreen(name){
  if (S.screen === name) return;
  const ix = S.stack.indexOf(name);
  if (ix >= 0) S.stack = S.stack.slice(0, ix); else S.stack.push(S.screen);
  go(name);
}
function backScreen(){
  const prev = S.stack.pop();
  go(prev && prev !== S.screen ? prev : "start");
}
function go(screen){
  if (screen !== S.screen){
    S.prev = S.screen; S.screen = screen; window.scrollTo(0, 0);
    if (S.toast && S.toast.undo){ clearTimeout(toastTimer); S.toast = null; }
  }
  render();
}

// Toasts expire by patching the DOM, not re-rendering, so a card mid-swipe isn't rebuilt.
let toastTimer = null;
function toast(text, undo){
  clearTimeout(toastTimer);
  S.toast = {text, undo:undo || null};
  toastTimer = setTimeout(() => {
    S.toast = null;
    const pill = document.querySelector(".undo-pill");
    if (pill) pill.outerHTML = metaHtml();
    const t = document.querySelector(".toast");
    if (t) t.remove();
  }, undo ? 4000 : 2400);
}

function startRound(){

  S.gen++; S.fetching = null; S.huntFetch = null; S.queue = []; S.nextUp = null; S.hunt = null; S.pendingHunt = false; S.roundId = ""; S.kindPos = 0; S.aiErr = null; S.aiInsight = ""; S.anchor = null; S.sampleRound = false; S.sampleWhy = "";
  S.current = null;

  go("explore");
}
function vote(v){
  const i = S.current;
  if (!i || S.busy) return;
  S.busy = true;
  const rec = recordVote(i, v, 1, "idea");
  S.round.votes.push(rec);
  const card = document.getElementById("card");
  const done = () => {
    S.busy = false;
    if (!S.sampleRound && isProduct(i)){ if (v === "like") converge(i); else maybeRedirect(); }
    S.current = nextIdea();
    toast(VOTE_LABEL[v] + " “" + i.title + "”", {rec, idea:i});
    render();
  };
  if (card && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    card.style.transition = "transform .22s ease, opacity .22s ease";
    card.style.transform = v === "later" ? "translateX(-130%) rotate(-10deg)" : "translateX(130%) rotate(10deg)";
    card.style.opacity = "0";
    setTimeout(done, 200);
  } else done();
}
function undo(){
  const t = S.toast && S.toast.undo;
  if (!t) return;
  undoVote(t.rec);
  const ix = S.round.votes.lastIndexOf(t.rec);
  if (ix >= 0) S.round.votes.splice(ix, 1);
  if (isAI(S.current) && S.current !== t.idea) S.nextUp = S.current; // shown again right after
  S.current = t.idea;
  clearTimeout(toastTimer);
  S.toast = null;
  if (S.screen !== "explore") S.screen = "explore";
  render();
}
function pickCurrent(){
  if (!S.current) return;

function toShop(){
  const i = S.current;
  const cb = document.getElementById("shipIL");
  if (cb) PREFS.shipIL = cb.checked;
  save("prefs", PREFS);
  if (!S.round.votes.some((v) => v.id === i.id && v.v === "love")){
    const rec = recordVote(i, "love", 1, "pick");
    S.round.votes.push(rec);
  }
  const last = PICKS[PICKS.length - 1];
  if (!last || last.id !== i.id){
    PICKS.push({id:i.id, title:i.title, tint:i.tint, at:Date.now()});
    if (PICKS.length > 100) PICKS = PICKS.slice(-100);
    save("picks", PICKS);
  }

  S.sheet = false;
  go("shop");

function moreLike(){

  if (isProduct(i)){
    // More real pieces like the pick, right after the next card.
    if (S.current && S.current.id === i.id) S.current = takeNext();
    converge(i);
    go("explore");
    return;
  }
  if (aiRound()){
    // Ask the AI for close variations of the pick.
    S.anchor = i; S.hunt = null; S.pendingHunt = false; S.huntFetch = null; S.gen++; S.fetching = null; S.queue = []; S.nextUp = null; S.aiErr = null; S.current = null;
    refill({count:4});
    go("explore");
    return;
  }
  S.current = nextIdea();
  if (!S.current && Q.type !== "Surprise me"){ Q.type = "Surprise me"; save("query", Q); S.current = nextIdea(); }
  go("explore");
}
async function copyText(text, msg){

}
function styleSummary(){
  const {pos, neg} = tasteLists();
  const list = (v) => TASTE.votes.filter((x) => x.v === v).slice(-10).map((x) => x.title);
  const lines = ["My clothing taste (menswear), from my Drape app:"];
  if (Q.type || Q.styles.length || Q.text) lines.push("Currently looking for: " + [Q.type, Q.styles.join(", "), Q.text].filter(Boolean).join(" — "));
  if (pos.length) lines.push("More of: " + pos.map(chipLabel).join(", "));

document.addEventListener("keydown", (e) => {
  if (Z.open){
    if (e.key === "Escape") zoomClose();
    else if (e.key === "ArrowLeft") zoomShow(Z.k - 1);
    else if (e.key === "ArrowRight") zoomShow(Z.k + 1);
    else if (e.key === "+" || e.key === "=") zoomStep(1.5);
    else if (e.key === "-") zoomStep(1 / 1.5);
    return;
  }
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && S.screen === "explore" && !S.modal && !S.sheet && !S.detail && !/^(INPUT|TEXTAREA)$/.test((e.target && e.target.tagName) || "")){
    vote(e.key === "ArrowLeft" ? "later" : "like"); return;
  }
  if (e.key !== "Escape") return;
  if (S.modal){ S.modal = null; render(); }
  else if (S.detail) closeDetail();
  else if (S.sheet){ S.sheet = false; render(); }
});

/* ---------------- swipe: ← not now, → getting closer ---------------- */
function bindSwipe(){
  const card = document.getElementById("card");
  if (!card) return;
  let x0 = null, y0 = 0, dx = 0, dy = 0, pid = null, t0 = 0, downEl = null;
  card.addEventListener("pointerdown", (e) => {
    if (S.busy || e.button > 0 || e.target.closest("button, a")) return; // the details button is a plain tap
    x0 = e.clientX; y0 = e.clientY; dx = dy = 0; pid = e.pointerId; t0 = Date.now(); downEl = e.target;
    try{ card.setPointerCapture(pid); }catch(err){}
    card.style.transition = "none";
  });
  card.addEventListener("pointermove", (e) => {
    if (x0 === null || e.pointerId !== pid) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    card.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${dx / 22}deg)`;
    card.style.setProperty("--yes", Math.max(0, Math.min(1, dx / 90)).toFixed(2));
    card.style.setProperty("--no", Math.max(0, Math.min(1, -dx / 90)).toFixed(2));
  });
  const back = () => { card.style.transition = "transform .18s ease"; card.style.transform = ""; card.style.setProperty("--yes", 0); card.style.setProperty("--no", 0); };
  const end = (e) => {
    if (x0 === null) return;
    const sx = x0;
    x0 = null;
    if (e.type === "pointerup" && Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now() - t0 < 600){
      // A tap: on the photo, its left or right side flips to the previous or next photo; on the text, the details open.
      back();
      const img = downEl && !downEl.closest(".idea-body") && downEl.closest(".idea-img");
      if (img){
        const r = img.getBoundingClientRect(), x = (sx - r.left) / r.width;
        if (photosOf(S.current).length < 2 || (x > 1 / 3 && x < 2 / 3)) zoomOpen(S.current, curPh());
        else flipPhoto(x <= 1 / 3 ? -1 : 1);
      }
      else if (downEl && downEl.closest(".idea-body")) openDetail(S.current, "card");
      return;
    }
    if (dx < -90) vote("later");
    else if (dx > 90) vote("like");
    else if (e.type === "pointerup" && dy < -90 && Math.abs(dx) < 70){ back(); openDetail(S.current, "card"); } // swipe up: details
    else back();
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

/* ---------------- Send to Claude (same pattern as Gym Bro / Skin Ritual) ----------------
   One tap captures the visible screen as a PNG plus a readable data file and
   opens the share sheet, so both go straight into a Claude chat; pick Claude
   and type your message there. A failed capture never blocks the report (the
   data still goes). No share sheet = the data is copied to the clipboard. */
const ASK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2.5l1.9 5.6 5.6 1.9-5.6 1.9L10 17.5l-1.9-5.6L2.5 10l5.6-1.9z"/><path d="M18.5 13.5l.95 2.55 2.55.95-2.55.95-.95 2.55-.95-2.55-2.55-.95 2.55-.95z"/></svg>';
let askState = "idle", askPending = null, askMsgT = null, askBusySince = 0;
function askBtn(){
  const label = askState === "working" ? "…" : askState === "ready" ? "Send" : ASK_ICON;
  return `<button type="button" id="askFab" class="icon-btn ask-btn${askState === "ready" ? " ready" : ""}" data-act="ask-report" data-report-ui="1" aria-label="${askState === "ready" ? "Tap again to send" : "Send this screen to Claude"}">${label}</button>`;
}
function savedBtn(){
  const n = SAVED.length + likedList().filter((x) => !isSaved(x.id)).length;
  return `<button type="button" class="icon-btn" data-act="saved" aria-label="Saved and liked pieces${n ? " (" + n + ")" : ""}">${ICON.mark}${n ? `<span class="badge" aria-hidden="true">${n > 99 ? "99+" : n}</span>` : ""}</button>`;
}
// Explore: report + saved. Start: all three. Saved: report + taste. Taste: report.
function hbtns(withProfile){
  const saved = S.screen === "explore" || S.screen === "start";
  const prof = withProfile && S.screen !== "explore";
  return `<span class="hbtns">${askBtn()}${saved ? savedBtn() : ""}${prof ? `<button type="button" class="icon-btn" data-act="profile" aria-label="Your taste profile">${ICON.person}</button>` : ""}</span>`;
}
function askSetState(st){
  askState = st;
  document.querySelectorAll(".ask-btn").forEach((b) => {
    b.classList.toggle("ready", st === "ready");
    b.innerHTML = st === "working" ? "…" : st === "ready" ? "Send" : ASK_ICON;
    b.setAttribute("aria-label", st === "ready" ? "Tap again to send" : "Send this screen to Claude");
  });
}
function askSetMsg(t){
  const m = document.getElementById("askMsg"); if (!m) return;
  m.textContent = t; m.classList.toggle("show", !!t);
  clearTimeout(askMsgT); if (t) askMsgT = setTimeout(() => askSetMsg(""), 4500);
}

const ASK_CAPTURE_LIB = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
let askLibP = null;
function askLoadLib(){
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  if (!askLibP) askLibP = new Promise((res, rej) => {
    const el = document.createElement("script"); el.src = ASK_CAPTURE_LIB; el.async = true;
    el.onload = () => window.html2canvas ? res(window.html2canvas) : rej(new Error("capture library missing"));
    el.onerror = () => { askLibP = null; rej(new Error("capture library failed to load")); };
    document.head.appendChild(el);
  });
  return askLibP;
}
// Preload so the tap is fast: iOS stops treating a slow tap as a tap by the time share() runs.
setTimeout(() => { askLoadLib().catch(() => {}); }, 2500);

const askStamp = (d = new Date()) => { const z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`; };
async function askCapture(){
  const h2c = await askLoadLib();
  const bg = getComputedStyle(document.body).backgroundColor || "#EEF0F3";
  const canvas = await h2c(document.body, {x:window.scrollX, y:window.scrollY, width:window.innerWidth, height:window.innerHeight,
    windowWidth:document.documentElement.clientWidth, scale:Math.min(2, window.devicePixelRatio || 1), backgroundColor:bg, logging:false, useCORS:true,
    ignoreElements:(el) => !!(el && (/^(NOSCRIPT|SCRIPT)$/.test(el.tagName) || (el.getAttribute && el.getAttribute("data-report-ui") === "1")))});
  // Stamp the app version into the corner so every report image shows it.
  try{
    const c = canvas.getContext("2d"), k = canvas.width / window.innerWidth, label = "Drape v" + APP_VERSION;
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); // html2canvas leaves the context scaled
    c.font = `500 ${11 * k}px ui-monospace, Menlo, monospace`;
    const w = c.measureText(label).width + 16 * k, h = 22 * k, x = canvas.width - w - 8 * k, y = canvas.height - h - 8 * k;
    c.fillStyle = "rgba(22,24,29,.82)"; c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, h / 2); else c.rect(x, y, w, h);
    c.fill(); c.fillStyle = "#fff"; c.textBaseline = "middle"; c.fillText(label, x + 8 * k, y + h / 2);
    c.restore();
  }catch(e){}
  return new Promise((res, rej) => canvas.toBlob((b) => b ? res(b) : rej(new Error("empty capture")), "image/png"));
}

// The readable half of the report: what the app is doing and why, which a screenshot can't show.
function askSnapshot(){
  const L = [];
  const row = (i) => !i ? "none" : isProduct(i) ? `${i.title} — ${i.brand} at ${i.store}, ${money(i.price, i.currency)}${i.was > i.price ? " (was " + money(i.was, i.currency) + ")" : ""} [${[i.colour, i.fabric, i.kind].filter(Boolean).join(", ")}] ${i.url}` : `${i.title} [${i.type}; ${i.colour}, ${i.fabric}, ${i.fit}, ${i.vibe}; ${(i.styles || []).join("/")}]${isAI(i) ? " (AI)" : " (sample)"}`;
  L.push(`app: ${APP_VERSION}   when: ${new Date().toISOString()}`);
  L.push(`screen: ${S.screen}${S.sheet ? " + pick sheet" : ""}${S.modal ? " + dialog" : ""}${S.detail ? " + details of \"" + S.detail.item.title + "\" (from " + S.detail.from + ", photo " + ((S.detail.ph || 0) + 1) + " of " + photosOf(S.detail.item).length + ")" : ""}${Z.open ? " + full-screen photo " + (Z.k + 1) + "/" + Z.list.length + " at " + Z.sc.toFixed(2) + "x" : ""}`);
  L.push(`ua: ${navigator.userAgent}`);
  L.push(`ai: ${aiOn() ? "on" : "off"}${S.sampleRound ? " (this round uses sample ideas)" : ""}   server: ${AI.url || DEFAULT_WORKER}   health: ${JSON.stringify(AI.health || null)}`);
  L.push(`ai request: ${S.fetching ? "in flight for " + Math.round((Date.now() - (S.fetchAt || Date.now())) / 1000) + "s" : "idle"}${S.huntFetch ? " + heart variations in flight" : ""}   last error: ${S.aiErr || "none"}   waiting ideas: ${S.queue.length}`);
  L.push(`server version: ${(AI.health && AI.health.version) || "unknown"}   (app expects ${SERVER_EXPECTED} or newer)`);
  L.push(`idea model: ${S.textModel || "-"} (last reply)   server says: ${(AI.health && AI.health.textModel) || "unknown"}`);
  L.push(`catalog: ${CAT.stores ? CAT.stores.stores.length + " stores, updated " + CAT.stores.updated + ", " + JSON.stringify(CAT.stores.counts) : "not loaded"}   pool for this search: ${S.pool ? S.pool.length : 0}   AI words: ${(S.aiKeys || []).join(", ") || "-"}${S.aiAvoid && S.aiAvoid.length ? "   avoid: " + S.aiAvoid.join(", ") : ""}`);
  if (S.diag) L.push(`AI check: ${JSON.stringify(S.diag)}`);
  L.push(`last photo error: ${S.imgErr || "none"}`);
  L.push(`\nSEARCH: type=${Q.type || "-"}  styles=${(Q.styles || []).join(", ") || "-"}  text="${Q.text || ""}"`);
  try{ const b = briefRead(); L.push(`YOUR WORDS READ AS: brands ${b.brands.join(", ") || "-"}; look for ${b.words.join(", ") || "-"}; avoid ${b.avoid.join(", ") || "-"}; store styles +${Object.keys(b.tags).join("/") || "-"} -${Object.keys(b.notTags).join("/") || "-"}; stores ${Object.keys(b.stores).join(", ") || "-"}`); }catch(e){}
  L.push(`LIKED: ${likedList().slice(0, 8).map((x) => x.title).join("; ") || "-"}`);
  L.push(`PREFS: ${JSON.stringify(PREFS)}`);
  L.push(`\nON SCREEN: ${row(S.current)}`);
  if (S.current) L.push(`  why: "${S.current.why || ""}"   search: "${S.current.search || ""}"   photo ${curPh() + 1} of ${photosOf(S.current).length}`);
  if (S.current && S.current.image_prompt) L.push(`  photo prompt: ${S.current.image_prompt}`);
  if (S.picked) L.push(`PICKED: ${row(S.picked)}`);
  if (S.queue.length) L.push(`NEXT UP: ${S.queue.slice(0, 5).map((i) => i.title).join("; ")}`);
  L.push(`\nTHIS ROUND (${S.round.votes.length} votes, oldest first):`);
  S.round.votes.slice(-25).forEach((v) => L.push(`  ${v.v.toUpperCase().padEnd(5)} ${v.title}`));
  if (S.aiInsight) L.push(`AI insight: ${S.aiInsight}`);
  const {pos, neg} = tasteLists();
  L.push(`\nTASTE: more of: ${pos.map(chipLabel).join(", ") || "-"}   less of: ${neg.map(chipLabel).join(", ") || "-"}`);
  L.push(`PICKS: ${PICKS.slice(-8).map((x) => x.title).join("; ") || "-"}`);
  L.push(`SAVED: ${SAVED.slice(-8).map((x) => x.title).join("; ") || "-"}`);
  return L.join("\n");
}
// The full data (the access code is left out on purpose).
function askData(meta){
  let snap; try{ snap = askSnapshot(); }catch(e){ snap = "(snapshot failed: " + (e && e.message || e) + ")"; }
  const full = {query:Q, prefs:PREFS, taste:TASTE, picks:PICKS, saved:SAVED.map((x) => x.title), round:S.round, current:S.current, queue:S.queue, ai:{url:AI.url, on:AI.on, health:AI.health}};
  return `DRAPE REPORT\n\n${snap}\n\nMETA: ${JSON.stringify(meta)}\n\n--- FULL DATA ---\n${JSON.stringify(full)}`;
}
async function askFiles(){
  const stamp = askStamp(), files = [];
  const meta = {screen:S.screen, viewport:{w:window.innerWidth, h:window.innerHeight, scrollY:Math.round(window.scrollY)}};
  try{
    const png = await Promise.race([askCapture(), new Promise((_, rej) => setTimeout(() => rej(new Error("screen capture timed out")), 6000))]);
    files.push(new File([png], `drape-screen-${stamp}.png`, {type:"image/png"}));
  }catch(e){ meta.captureError = String(e && e.message || e); }
  files.push(new File([askData(meta)], `drape-data-${stamp}.txt`, {type:"text/plain"}));
  return files;
}
// "shared" | "shared-data-only" | "cancelled" | "needs-tap" | "unsupported" | "failed"
async function askShare(files){
  const nav = navigator;
  if (!nav || typeof nav.share !== "function" || !files.length) return "unsupported";
  const can = (l) => typeof nav.canShare !== "function" || !!nav.canShare({files:l});
  let list = files;
  if (!can(list)){ list = files.filter((f) => f.type === "text/plain"); if (!list.length || !can(list)) return "unsupported"; }
  try{ await nav.share({files:list, title:"Drape report"}); return list.length === files.length ? "shared" : "shared-data-only"; }
  catch(e){ const n = e && e.name; if (n === "AbortError") return "cancelled"; if (n === "NotAllowedError") return "needs-tap"; return "failed"; }
}
async function askHandle(result, files){
  if (result === "needs-tap"){ askPending = files; askSetState("ready"); return; }
  askPending = null; askSetState("idle");
  if (result === "shared-data-only") askSetMsg("Sent the data. The screen image isn't supported here.");
  if (result === "unsupported" || result === "failed"){
    try{ const tf = files && files.find((f) => f.type === "text/plain"); await navigator.clipboard.writeText(await tf.text()); askSetMsg("Copied. Paste it into a Claude chat."); }
    catch(e){ askSetMsg("Couldn't share or copy the report on this device"); }
  }
}
// The button must never stay stuck on "…": the capture is time-boxed, every step is guarded,
// and a tap on a button that has been busy too long resets it.
async function askTap(){
  if (askState === "working"){
    if (Date.now() - askBusySince < 15000) return;
    askSetState("idle"); askPending = null;
  }
  askBusySince = Date.now();
  let files = null;
  try{
    if (askState === "ready" && askPending){ files = askPending; askSetState("working"); }
    else { askSetState("working"); files = await askFiles(); }
    await askHandle(await askShare(files), files);
  }catch(e){
    askPending = null; askSetState("idle");
    if (files) await askHandle("failed", files);
    else askSetMsg("Couldn't build the report: " + (e && e.message || e));
  }finally{
    if (askState === "working") askSetState("idle");
  }
}

/* ---------------- update the app ----------------
   Same idea as Gym Bro's version badge: save, ask the service worker to check
   for a new version (never waiting long; iOS can hang there), drop the cached
   app files and reload. After the reload a toast says whether it changed. */
async function appRefresh(){
  document.querySelectorAll('[data-act="refresh"]').forEach((b) => { b.disabled = true; b.textContent = "Updating…"; });
  try{ const ta = document.getElementById("txt"); if (ta){ Q.text = ta.value; save("query", Q); } }catch(e){}
  saveSession();
  save("updatedFrom", APP_VERSION);
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await Promise.race([reg.update().catch(() => {}), new Promise((r) => setTimeout(r, 1500))]);
  }catch(e){}
  try{ if (window.caches){ const keys = await caches.keys(); await Promise.all(keys.filter((k) => k.startsWith("drape-v")).map((k) => caches.delete(k))); } }catch(e){}
  location.reload();
  setTimeout(() => { location.href = location.pathname; }, 1500); // if the reload is ignored
}
// Ask the server which version it runs (quietly, on start-up) so reports and the
// profile show whether Cloudflare has deployed the latest server code.
async function checkServer(){
  if (!aiOn()) return;
  try{
    const r = await fetch(workerBase() + "/health?code=" + encodeURIComponent(AI.code), {cache:"no-store"});
    const j = await r.json();
    if (r.ok){ AI.health = {ideas:!!j.ideas, images:!!j.images, version:j.version || "before 0.7", textModel:j.textModel || "", imageModel:j.imageModel || ""}; save("ai", AI); if (S.screen === "profile") render(); }
  }catch(e){}
}
function afterUpdate(){
  const from = load("updatedFrom", null);
  if (!from) return;
  try{ localStorage.removeItem(LS + "updatedFrom"); }catch(e){}
  toast(from === APP_VERSION ? "You're on the latest version (" + APP_VERSION + ")" : "Updated to " + APP_VERSION);
  render();
}

/* ---------------- boot ---------------- */
// v0.9.1: rebuild the taste weights with the softer values (older versions pushed every "not now"
// hard against cotton, smart-casual and so on).
function rebuildTaste(){
  const w = {};
  const add = (i, n) => { for (const a of attrsOf(i)){ const k = akey(a); w[k] = (w[k] || 0) + n; } };
  for (const v of TASTE.votes){ const i = byId(v.id); if (i && VAL[v.v]) add(i, VAL[v.v] * (v.f || 1)); }
  for (const x of SAVED) add(x, SAVE_VAL);
  for (const k in w) if (Math.abs(w[k]) < 1e-9) delete w[k];
  TASTE.w = w; TASTE.ver = 2;
  save("taste", TASTE);
}
if (TASTE.ver !== 2) rebuildTaste();
if (!LIKED){
  LIKED = [];
  const done = new Set();
  for (let j = TASTE.votes.length - 1; j >= 0; j--){ const v = TASTE.votes[j]; if (done.has(v.id)) continue; done.add(v.id); const i = AIDB[v.id] || SAVED.find((x) => x.id === v.id); if (i && isProduct(i) && (v.v === "like" || v.v === "love")) LIKED.push(Object.assign({}, i, {likedAt:v.at})); }
  save("liked", LIKED);
}
restoreSession();
render();
afterUpdate();
checkServer();
// Back to a search in progress: reload the catalog (cached), then carry on where you were.
if (S.screen === "explore" && !S.sampleRound && (S.current || S.round.votes.length)) loadCatalog().then((pool) => { S.pool = pool; if (S.queue.length <= LOW_QUEUE) refill(); if (!S.current){ S.current = takeNext(); render(); } else preloadAhead(); }).catch(() => {});
if ("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
