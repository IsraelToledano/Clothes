# Rebuilds Drape's product catalog (real menswear from real stores) once a day and publishes it with the
# app on GitHub Pages, in catalog/. No AI, no keys: each store's public /products.json.
name: catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the catalog
        run: node scripts/build-catalog.mjs
      - name: Publish it
        run: |
          git config user.name "drape-catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "Catalog update $(date -u +%Y-%m-%d)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
