# Rebuilds Drape's product catalog (real menswear from real stores) once a day. No AI, no keys: each store's
# public /products.json. It goes on its own branch, catalog-data, replaced each day (one commit, so the repo
# doesn't grow); the app reads it from raw.githubusercontent.com.
name: catalog
on:
  workflow_dispatch:
    inputs:
      target:
        description: "main publishes it (the catalog-data branch); preview only puts it on the catalog-preview branch, for checking"
        default: main
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the catalog
        run: node scripts/build-catalog.mjs
      - name: Publish it (catalog-data), or a preview (catalog-preview)
        run: |
          git config user.name "drape-catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=catalog-data; [ "${{ inputs.target }}" = "preview" ] && BRANCH=catalog-preview
          mv catalog /tmp/catalog && git checkout -q --orphan "$BRANCH" && git rm -rqf . && mv /tmp/catalog catalog
          git add catalog && git commit -qm "Catalog $(date -u +%Y-%m-%dT%H:%M)" && git push -qf origin "$BRANCH"
