# Cloudflare Worker for Drape's AI (see worker/worker.js).
# Lives at the repo root so Cloudflare's GitHub build deploys the worker itself
# rather than publishing the repo as a static site. GitHub Pages ignores this file.
name = "clothes-ai"
main = "worker/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Ideas (Llama 3.3 70B) and photos (FLUX.1 schnell) run on Workers AI:
# no API keys, free daily allowance, never charged on the free plan.
[ai]
binding = "AI"

# The one secret, ACCESS_CODE, is set in the Cloudflare dashboard, not here.
